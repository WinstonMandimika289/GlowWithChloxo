# Builds the Astro site and deploys it to GitHub Pages (glow-with-chlo.com).
# GitHub Pages is static hosting, so the on-demand /api/chat route is removed and the
# site is built without the Node adapter. The chat widget then uses PUBLIC_CHAT_ENDPOINT
# (the Cloudflare Worker in worker/groq-proxy.js) if set, otherwise its built-in answers.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static site
        run: |
          rm -rf src/pages/api
          npm run build
        env:
          DEPLOY_TARGET: static
          PUBLIC_CHAT_ENDPOINT: ${{ vars.PUBLIC_CHAT_ENDPOINT }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
